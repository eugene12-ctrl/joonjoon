<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>달이 팔레트 실험실</title>
<!-- Color Hunt 인기 팔레트를 달이 화면에 바로 입혀 보는 비교 페이지. 앱은 iframe으로 띄우고 postMessage("dali-palette")로 색을 보냄(받는 쪽은 features/dali/dali-plus.js 끝). 팔레트 목록은 Color Hunt 공개 목록에서 받은 값. 시연 화면에는 쓰지 않음 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Malgun Gothic",sans-serif;background:#F2F4F6;color:#1A1D1F;display:flex;height:100vh}
.left{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:12px 20px;background:#E9ECEF}
.stage{width:375px;height:780px;transform-origin:top center}
.left iframe{width:375px;height:780px;border:0;border-radius:34px;background:#fff;box-shadow:0 20px 40px -20px rgba(11,51,64,.5);display:block}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;justify-content:center}
.ctl button{padding:7px 11px;border-radius:999px;border:1px solid #D5D9DD;background:#fff;font:inherit;font-size:13px;cursor:pointer}
.ctl button.on{background:#1A1D1F;color:#fff;border-color:#1A1D1F}
.right{flex:1;overflow:auto;padding:16px 20px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:18px;margin:0}.top label{font-size:13px;color:#4E5968;display:flex;gap:6px;align-items:center}
.now{font-size:13px;color:#4E5968}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.card:hover{transform:translateY(-2px)}.card.sel{border-color:#1A1D1F}
.sw{display:flex;height:64px}.sw i{flex:1}
.meta{padding:7px 9px;font-size:11.5px;color:#4E5968;display:flex;justify-content:space-between;gap:4px}
.meta b{color:#1A1D1F}.warn{color:#C8202C}.ok{color:#1B7F4B}
.roles{display:flex;gap:4px;padding:0 9px 8px}.roles span{font-size:10.5px;display:flex;align-items:center;gap:3px;color:#646F7C;white-space:nowrap}
.roles span i{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.1)}
</style></head><body>
<div class="left">
  <div class="ctl" id="scenes">
    <button data-sc="morning" class="on">아침</button><button data-sc="intraday">장중</button><button data-sc="close">마감</button><button data-sc="month">월말</button>
    <button id="reset">지금 색으로</button>
  </div>
  <div class="stage" id="stage"><iframe id="app" src="../../index.html" scrolling="no"></iframe></div>
</div>
<div class="right">
  <div class="top"><h1>Color Hunt 인기 팔레트</h1>
    <label><input type="checkbox" id="only" checked> 글자로 쓸 진한 색이 있는 것만</label>
    <label><input type="checkbox" id="noclash" checked> 시세 빨강 파랑과 겹치는 색은 포인트에서 제외</label>
    <label><input type="checkbox" id="bg" checked> 바탕까지 바꾸기</label>
    <label><input type="checkbox" id="far"> 토스와 비슷한 것 숨기기</label>
    <span class="now" id="now">선택: 지금 색</span></div>
  <div class="grid" id="grid"></div>
</div>

const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
const lin=v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4;
const L=h=>{const[r,g,b]=rgb(h).map(lin);return .2126*r+.7152*g+.0722*b};
const CR=(a,b)=>{const x=L(a),y=L(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function hsl(h){const[r,g,b]=rgb(h),mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;if(!d)return[0,0,l];const s=d/(1-Math.abs(2*l-1));let H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return[(H*60+360)%360,s,l]}
const clash=h=>{const[H,S]=hsl(h);if(S<.35)return false;return H>=345||H<=15||(H>=210&&H<=235)};
function roles(cols){const noc=document.getElementById("noclash").checked;
  const info=cols.map(c=>({c,w:CR(c,"#FFFFFF"),s:hsl(c)[1],x:clash(c)}));
  const brand=info.filter(x=>x.w>=4.5&&!(noc&&x.x)).sort((a,b)=>b.s-a.s)[0];
  const tint=[...info].sort((a,b)=>L(b.c)-L(a.c))[0];
  const deep=info.filter(x=>x.w>=4.5).sort((a,b)=>L(a.c)-L(b.c))[0];
  const light=[...info].sort((a,b)=>L(b.c)-L(a.c));
  const bg=CR(light[0].c,"#1A1D1F")>=9?light[0].c:null, band=light[1]&&CR(light[1].c,"#1A1D1F")>=7?light[1].c:null;
  // 토스와 비슷: 포인트가 토스 파랑 계열(색상 205~225, 채도 0.6 이상)이거나, 바탕과 띠가 차가운 무채색
  const b=brand&&hsl(brand.c), cold=c=>{const h=hsl(c);return h[1]<.25&&h[0]>=180&&h[0]<=240};
  const toss=(b&&b[0]>=205&&b[0]<=225&&b[1]>=.6)||(!document.getElementById("bg").checked)||((!bg||cold(bg))&&(!band||cold(band)));
  return{brand:brand&&brand.c,tint:tint.c,deep:deep&&deep.c,bg,band,toss}}
const cssFor=r=>{const b=r.brand||"#1B5F6B",d=r.deep||b;
  return ".phone{--d-brand2:"+b+";--d-brand:"+b+";--d-brand-tint:"+r.tint+"}"+
  ".phone .dali-pro-act,.phone .dali-pro-act.sc-morning,.phone .dali-pro-act.sc-intraday,.phone .dali-pro-act.sc-close,.phone .dali-pro-act.sc-month{background:"+d+"!important}"+
  ".phone .dali-pro-act-btns button:first-child{color:"+d+"!important}"+
  ".phone .dali-tabs button.on,.phone .dali-pebbles{color:"+b+"}"+
  (document.getElementById("bg").checked?(r.bg?".phone .dali-sheet,.phone .dali-body,.phone .dali-pro-head,.phone .dali-pro-rows,.phone .dali-tabs{background:"+r.bg+"!important}":"")+(r.band?".phone{--d-band:"+r.band+"}.phone .dali-pro-sec,.phone .dali-pro-unfold{border-top-color:"+r.band+"!important}":""):"");};
let sc="morning",cur="";
const app=document.getElementById("app");
const FRAME="html,body{margin:0!important;padding:0!important;background:#fff!important;overflow:hidden!important}body{display:block!important;min-height:0!important}.phone{width:375px!important;height:780px!important;min-height:0!important;border-radius:0!important;box-shadow:none!important;margin:0!important}.dali-demo{display:none!important}";
const send=()=>app.contentWindow.postMessage({type:"dali-palette",css:FRAME+cur,scene:sc},"*");
function fit(){const h=window.innerHeight-70;const k=Math.min(1,h/780);const st=document.getElementById("stage");st.style.transform="scale("+k+")";st.style.height=(780*k)+"px";st.style.width=(375*k)+"px";st.style.transformOrigin="top left";}
window.addEventListener("resize",fit);fit();
app.addEventListener("load",()=>setTimeout(send,1500));
function draw(){const only=document.getElementById("only").checked;const g=document.getElementById("grid");g.innerHTML="";
  P.forEach((p,i)=>{const cols=p.code.match(/.{6}/g).map(h=>"#"+h.toUpperCase()),r=roles(cols);
    if(only&&!r.brand)return;
    if(document.getElementById("far").checked&&r.toss)return;
    const el=document.createElement("div");el.className="card";
    el.innerHTML="<div class=sw>"+cols.map(c=>"<i style=background:"+c+"></i>").join("")+"</div>"+
      "<div class=meta><span>♥ <b>"+p.likes.toLocaleString()+"</b></span><span class="+(r.toss?"warn":"ok")+">"+(r.toss?"토스와 비슷":"토스와 다름")+"</span></div>"+
      "<div class=roles><span><i style=background:"+(r.brand||"#1B5F6B")+"></i>포인트</span><span><i style=background:"+(r.deep||r.brand||"#1B5F6B")+"></i>히어로</span><span><i style=background:"+(r.bg||"#FFFFFF")+"></i>배경</span></div>";
    el.onclick=()=>{document.querySelectorAll(".card.sel").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");
      cur=cssFor(r);document.getElementById("now").textContent="선택: "+cols.join(" ")+(r.brand?"":" (포인트는 지금 색 유지)");send();};
    g.appendChild(el);});}
document.getElementById("only").onchange=draw;document.getElementById("far").onchange=draw;document.getElementById("bg").onchange=()=>{draw();};document.getElementById("noclash").onchange=draw;
document.getElementById("scenes").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.id==="reset"){cur="";document.querySelectorAll(".card.sel").forEach(x=>x.classList.remove("sel"));document.getElementById("now").textContent="선택: 지금 색";send();return;}
  sc=b.dataset.sc;document.querySelectorAll("#scenes [data-sc]").forEach(x=>x.classList.toggle("on",x===b));send();};
draw();
