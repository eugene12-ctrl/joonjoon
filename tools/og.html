<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>달이 썸네일 (og.png 원본)</title>
<!-- 링크 미리보기 썸네일(og.png, 1200×630)의 원본. headless Chrome으로 이 페이지를 1200×630으로 찍는다: tools/og-render.mjs
     글: "이젠 유진이 먼저 답해요." / "달이". 그림: 달이 전신(features/dali/dali-body.png). 바탕은 달이 바다의 청록 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #fff; }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #1F8B97;
    background-image: radial-gradient(900px 520px at 68% 62%, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 70%);
  }
  .text { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
  .text small { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; opacity: .96; }
  .text h1 { margin: -6px 0 0; font-size: 230px; font-weight: 900; line-height: 1; letter-spacing: -.05em; }
  .text p { margin: 18px 0 0; font-size: 26px; font-weight: 500; letter-spacing: -.01em; line-height: 1.45; opacity: .85; word-break: keep-all; }
  .otter { position: absolute; right: 118px; bottom: -16px; width: 560px; height: 560px; }
  .otter img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 28px 36px rgba(0, 40, 48, .35)); }
  .foot { position: absolute; left: 96px; bottom: 34px; margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -.01em; opacity: .7; }
  .wave { position: absolute; left: 0; right: 0; bottom: -40px; height: 150px; opacity: .22; }
</style>
</head>
<body>
<div class="og">
  <svg class="wave" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 80 C 150 20, 300 140, 450 80 S 750 20, 900 80 S 1100 140, 1200 80 V 150 H 0 Z" fill="#fff"/>
  </svg>
  <div class="text">
    <small>이젠 유진이 먼저 답해요.</small>
    <h1>달이</h1>
    <p>내 종목을 따라가고, 매매일지를 쓰고,<br>조약돌을 모아 자라는 해달 비서</p>
  </div>
  <p class="foot">팀 준준 · 시연용 가상 화면</p>
  <figure class="otter" style="margin:0"><img src="../features/dali/dali-body.png" alt="달이"></figure>
</div>
</body>
</html>
